[package]
name = "multi-base"
version = "1.0.4"
authors = ["Friedel Ziegelmayer <dignifiedquire@gmail.com>", "Dave Grantham <dwg@linuxprogrammer.org>"]
edition = "2024"
rust-version = "1.85"
license = "MIT"
readme = "README.md"
description = "multibase in rust"
repository = "https://github.com/cryptidtech/multi-base.git"
keywords = ["ipld", "ipfs", "multihash", "cid", "no_std"]
categories = ["encoding"]

[features]
default = ["std"]
std = ["data-encoding/std"]

[dependencies]
base-x = { version = "0.2.7", default-features = false }
data-encoding = { version = "2.3.1", default-features = false, features = ["alloc"] }
data-encoding-macro = "0.1.9"
thiserror = { version = "2.0", default-features = false }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
proptest = "1.4"
rand = "0.10"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# `data-encoding-macro-internal` and `zerocopy-derive` pin `syn 2.x`, while
# `serde_derive` and `thiserror-impl` use `syn 3.x`. This will resolve when
# the remaining proc-macro crates upgrade to `syn 3`.
multiple_crate_versions = { level = "allow", priority = 1 }

[lints.rust]
unsafe_code = "deny"

[[bench]]
name = "multibase"
harness = false
path = "benches/multibase.rs"
